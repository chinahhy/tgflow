services:
  tgflow:
    image: ${DOCKERHUB_USERNAME:?请在 .env 中设置 Docker Hub 用户名}/tgflow:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_ROOT: /app/data
      DOWNLOAD_ROOT: /downloads
      # 分享 / BT 做种已在 dev 代码中永久禁用，此项保留用于明确部署意图。
      SHARE_ENABLED: "false"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?请设置 Telegram API ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?请设置 Telegram API Hash}
      TELEGRAM_LOG_LEVEL: ${TELEGRAM_LOG_LEVEL:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
    ports:
      - "${PORT:-8026}:8026"
    volumes:
      - ${CONFIG_DIR:-${DATA_DIR:-./data}}:/app/data
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8026/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
