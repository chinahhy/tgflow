services:
  tgflow:
    image: hoya0803/tgflow:dev
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
    ports:
      - "${PORT:-8026}:8026"
    volumes:
      - ${CONFIG_DIR:-${DATA_DIR:-./data}}:/app/data
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
