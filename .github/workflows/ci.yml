name: Validate and prepare artifacts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    env:
      TDLIB_PATH: ${{ github.workspace }}/libs/linux_x64
      APP_ENV: prod
      TELEGRAM_API_ID: '1'
      TELEGRAM_API_HASH: test-only-placeholder
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        id: tdlib
        with:
          path: libs
          key: tdlib-test-glibc-1.15.0
      - name: Prepare upstream TDLib test runtime
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o ../libs.zip https://github.com/p-vorobyev/spring-boot-starter-telegram/releases/download/1.15.0/libs.zip
          unzip -q ../libs.zip -d ..
      - name: Test and package API once
        run: ./gradlew test jacocoTestReport shadowJar --no-daemon
      - name: Prepare Docker API artifacts
        run: |
          mkdir -p ../.docker-artifacts
          cp build/libs/telegram-files.jar ../.docker-artifacts/api.jar
          jdeps --print-module-deps --ignore-missing-deps ../.docker-artifacts/api.jar > ../.docker-artifacts/dependencies.txt
          test -s ../.docker-artifacts/api.jar
          test -s ../.docker-artifacts/dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docker-api
          path: .docker-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            api/build/reports/tests/
            api/build/reports/jacoco/
          retention-days: 7
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:18028
      NEXT_PUBLIC_WS_URL: ws://localhost:18028/ws
      NEXT_PUBLIC_SCAN: 'false'
      NEXT_PUBLIC_MOCK_DATA: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production web artifact
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docker-web
          path: web/out/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
