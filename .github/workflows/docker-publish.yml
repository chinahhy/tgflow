name: TGFlow CI and Docker
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tgflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  docker:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: docker-api
          path: .docker-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: docker-web
          path: .docker-artifacts/web
      - name: Verify prerequisites
        run: |
          test -s .docker-artifacts/api.jar
          test -s .docker-artifacts/dependencies.txt
          test -s .docker-artifacts/web/index.html
          file tdlib/linux_amd64/libtdjni.so | grep -q 'x86-64'
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 image once
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: tgflow:ci
          load: true
          cache-from: type=gha,scope=tgflow-amd64
          cache-to: type=gha,scope=tgflow-amd64,mode=max
      - name: Smoke test the built container
        run: |
          docker run -d --name tgflow-smoke \
            -e APP_ENV=prod -e APP_ROOT=/app/data \
            -e TELEGRAM_API_ID=1 -e TELEGRAM_API_HASH=test-only-placeholder \
            -e HTTP_SECURE_COOKIES=false -e SHARE_ENABLED=false \
            -p 127.0.0.1:6543:80 tgflow:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6543/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:6543/api/health
          curl --fail --silent http://127.0.0.1:6543/ | grep -q TGFlow
          curl --fail --silent http://127.0.0.1:6543/api/auth/bootstrap/status | grep -q true
      - name: Determine branch tag and Docker Hub readiness
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          publish=false
          tag=''
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=latest; fi
          if [ "$GITHUB_REF" = refs/heads/dev ]; then tag=dev; fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ -n "$tag" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo 'Image built and tested; publication skipped (PR, unsupported ref, or missing DOCKERHUB_USERNAME / DOCKERHUB_TOKEN).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested image to its branch tag
        if: steps.release.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          image="$DOCKERHUB_USERNAME/tgflow:$IMAGE_TAG"
          docker tag tgflow:ci "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image"
          echo "Published: $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f tgflow-smoke || true
