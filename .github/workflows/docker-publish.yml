name: TGFlow CI and Docker
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tgflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  docker:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: docker-api
          path: .docker-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: docker-web
          path: .docker-artifacts/web
      - name: Verify prerequisites
        run: |
          test -s .docker-artifacts/api.jar
          test -s .docker-artifacts/dependencies.txt
          test -s .docker-artifacts/web/index.html
          file tdlib/linux_amd64/libtdjni.so | grep -q 'x86-64'
          DOCKERHUB_USERNAME=hoya0803 TELEGRAM_API_ID=1 TELEGRAM_API_HASH=test-only-placeholder docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 image once
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: tgflow:ci
          load: true
          cache-from: type=gha,scope=tgflow-amd64
          cache-to: type=gha,scope=tgflow-amd64,mode=max
      - name: Smoke test the built container
        run: |
          docker run -d --name tgflow-smoke \
            -e APP_ENV=prod -e APP_ROOT=/app/data \
            -e DOWNLOAD_ROOT=/downloads \
            -e TELEGRAM_API_ID=1 -e TELEGRAM_API_HASH=test-only-placeholder \
            -e HTTP_SECURE_COOKIES=false -e SHARE_ENABLED=false \
            -v "$RUNNER_TEMP/tgflow-state:/app/data" \
            -v "$RUNNER_TEMP/tgflow-downloads:/downloads" \
            -p 127.0.0.1:8026:8026 tgflow:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8026/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8026/api/health
          curl --fail --silent http://127.0.0.1:8026/ | grep -q TGFlow
          curl --fail --silent http://127.0.0.1:8026/api/auth/bootstrap/status | grep -q true
          docker exec tgflow-smoke sh -c 'test -f /app/data/data.db && test -d /downloads'
      - name: Test HTTPS reverse proxy and Secure cookies
        run: |
          mkdir -p "$RUNNER_TEMP/tgflow-proxy-tls"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=tgflow-proxy-test' -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/tgflow-proxy-tls/key.pem" \
            -out "$RUNNER_TEMP/tgflow-proxy-tls/cert.pem" > /dev/null 2>&1
          docker run -d --name tgflow-https-proxy --network host --entrypoint nginx \
            -v "$GITHUB_WORKSPACE/.github/fixtures/https-proxy.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/tgflow-proxy-tls:/test-tls:ro" \
            tgflow:ci -g 'daemon off;'
          for mode in auto true false; do
            cookie_env=()
            extra_origin=()
            if [ "$mode" != auto ]; then cookie_env+=( -e "HTTP_SECURE_COOKIES=$mode" ); fi
            if [ "$mode" = true ]; then
              cookie_env+=( -e HTTP_ALLOWED_ORIGINS=http://legacy.example.test:6543 )
              extra_origin+=( --extra-origin http://legacy.example.test:6543 )
            fi
            docker run -d --name tgflow-secure \
              -e APP_ENV=prod -e APP_ROOT=/app/data -e DOWNLOAD_ROOT=/downloads \
              -e TELEGRAM_API_ID=1 -e TELEGRAM_API_HASH=test-only-placeholder \
              -e SHARE_ENABLED=false "${cookie_env[@]}" \
              -p 127.0.0.1:18026:8026 tgflow:ci
            if ! python3 scripts/test-https-proxy.py --container tgflow-secure \
              --ca-file "$RUNNER_TEMP/tgflow-proxy-tls/cert.pem" --cookie-mode "$mode" "${extra_origin[@]}"; then
              docker logs tgflow-https-proxy
              exit 1
            fi
            docker rm -f tgflow-secure
          done
      - name: Verify sharing and BT cannot be enabled
        run: python3 scripts/test-sharing-disabled.py --image tgflow:ci
      - name: Determine branch tag and Docker Hub readiness
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          publish=false
          tag=''
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=latest; fi
          if [ "$GITHUB_REF" = refs/heads/dev ]; then tag=dev; fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ -n "$tag" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo 'Image built and tested; publication skipped (PR, unsupported ref, or missing DOCKERHUB_USERNAME / DOCKERHUB_TOKEN).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested image to its branch tag
        if: steps.release.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          image="$DOCKERHUB_USERNAME/tgflow:$IMAGE_TAG"
          docker tag tgflow:ci "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image"
          echo "Published: $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture container failure details
        if: failure()
        run: |
          for container_name in tgflow-smoke tgflow-secure tgflow-https-proxy tgflow-share-blocked; do
            docker logs "$container_name" 2>&1 | sed '/one-time bootstrap code/d' || true
          done
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f tgflow-smoke tgflow-secure tgflow-https-proxy tgflow-share-blocked || true
